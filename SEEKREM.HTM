<!DOCTYPE HTML>
<HTML>
    <HEAD>
        <META CHARSET="UTF-8" AUTHOR="MAGNETICON">
        <TITLE>SEEKREM 1.00</TITLE>
        <STYLE TYPE="TEXT/CSS">
            BODY{
                COLOR: #00CC00;
                BACKGROUND-COLOR: #000000;
                FONT-SIZE: 20PX;
                FONT-FAMILY: 'Pcomm Session', monospace;
            }
            #CMD{
                WIDTH: 90VW;
                HEIGHT: 12.5VH;
            }
            .INPOUT{
                WIDTH: 45VW;
                HEIGHT: 25VH;
                COLOR: #00CCFF;
                BACKGROUND-COLOR: #000000;
                BORDER: 3PX SOLID #00CC00;
                FONT-SIZE: 20PX;
                BORDER-RADIUS: 10PX;
                OVERFLOW: AUTO;
            }
            .OUT{
                WIDTH: 90VW;
                HEIGHT: 35VH;
                OVERFLOW: AUTO;
                BORDER: 3PX SOLID #00CC00;
                COLOR: #FFCC00;
                BACKGROUND-COLOR: #000000;
                FONT-SIZE: 20PX;
                BORDER-RADIUS: 10PX;
            }
            .TEXT{
                BORDER: 3PX SOLID #00CC00;
                COLOR: #FFCC00;
                BACKGROUND-COLOR: #000000;
                FONT-SIZE: 20PX;
                BORDER-RADIUS: 10PX;
                WIDTH: 70VW;
            }
            .OUTPUTS{
                WIDTH: 95VW;
                HEIGHT: 38VH;
                OVERFLOW-Y: AUTO;
                OVERFLOW-X: HIDDEN;
                COLOR: #FFCC00;
                BACKGROUND-COLOR: #000000;
            }
            #MBOX{
                BACKGROUND-COLOR: #0000AA;
                COLOR: #FF0000;
                WIDTH: 30VH;
                HEIGHT: 8VH;
                RIGHT: 2VH;
                TOP: 2VH;
                DISPLAY: FLEX;
                JUSTIFY-CONTENT: CENTER;
                ALIGN-ITEMS: CENTER;
                FONT-SIZE: 4.5VH;
                FONT-FAMILY: ARIAL;
                FONT-WEIGHT: BOLD;
                POSITION: ABSOLUTE;
                BORDER-RADIUS: 10PX;
            }
            #MBOX:HOVER{
                BACKGROUND-COLOR: #FF0000;
                COLOR: #0000AA;
                CURSOR: POINTER;
            }
            .BUTTON{
                COLOR: #00CC00;
                BACKGROUND-COLOR: #000000;
                BORDER: 3PX OUTSET #00CC00;
                DISPLAY: INLINE-FLEX;
                JUSTIFY-CONTENT: CENTER;
                FONT-WEIGHT: BOLD;
                ALIGN-ITEMS: CENTER;
                /* WIDTH: 200PX; */
                HEIGHT: 40PX;
                CURSOR: POINTER;
                BORDER-RADIUS: 25PX;
                WIDTH: FIT-CONTENT;
                WHITE-SPACE: NOWRAP;
            }
            .BUTTONTABLE{
                BORDER-RADIUS: 0PX;
                WIDTH: FIT-CONTENT;
                WHITE-SPACE: NOWRAP;
            }
            .BUTTON:HOVER{
                COLOR: #000000;
                BACKGROUND-COLOR: #00CC00;
            }
            #RECORDS{
                COLOR: #FF00CC;
            }
            .RECORD{
                COLOR: #FF00CC;
            }
        </STYLE>
        <SCRIPT TYPE="TEXT/JAVASCRIPT">
            function RUN(){
                GtE("OUT").value = "";
                var d1 = GtE("INP").value;
                var H = d1.split(/\n/);
                var S = GtE("PREFIX").value.trim();
                var P = GtE("SUFFIX").value;
                var E = 0;
                if (S == '0' || S == '1' || S == '2' || S == '3' || S == '4' || S == '5' || S == '6' || S == '7' || S == '8' || S == '9')
                    E = parseInt(S, 10);
                var R = "";
                var Q = 0;
                for (var i = 0; i < H.length; i++){
                    if (R != "") R += "\n";
                    var Z = H[i].split(P);
                    var A = "";
                    for (var j = 0; j < Z.length; j++){
                        if (j == E) continue;
                        else{
                            if (A != "") A += ""+P;
                            A += ""+Z[j];
                        }
                    }
                    if (A != ""){
                        R += A;
                        Q++;
                    }
                }
                GtE("OUT").value = R;
                GtE("RECORDS").innerHTML = Q;
            }
            
            function GtE(id){
                return document.getElementById(id);
            }
        </SCRIPT>
    </HEAD>
    <BODY>
        <H1>SEEKREM 1.00</H1>
        <I>Save manual work and have your unwanted objects extracted from a thousands records long list!</I>
        <BR><BR>
        <TABLE>
            <TR>
                <TD>INPUT:<BR><TEXTAREA ID="INP" CLASS="INPOUT"></TEXTAREA></TD>
                <TD STYLE="WIDTH: 5VH;"></TD>
                <TD>OUTPUT:<BR><TEXTAREA ID="OUT" CLASS="INPOUT" STYLE="COLOR: #CC0000;"></TEXTAREA></TD>
            </TR>
        </TABLE>
        <BR>
        <SPAN CLASS="BUTTON" ONCLICK="JAVASCRIPT: RUN();">&nbsp;&nbsp;PROCESS&nbsp;&nbsp;</SPAN>
        <SPAN STYLE="POSITION: ABSOLUTE; RIGHT: 10VH;"><B>TOTAL AMOUNT OF RECORDS:&nbsp;</B><SPAN ID="RECORDS">0</SPAN></SPAN>
        <BR><BR>
            Index of Element to remove (start from 0, end at 9):<BR><INPUT TYPE="TEXT" ID="PREFIX" CLASS="TEXT">
        <BR><BR>
            Parse by delimiter:<BR><INPUT TYPE="TEXT" ID="SUFFIX" CLASS="TEXT">
        <DIV ID="MBOX" ONCLICK="JAVASCRIPT: window.open('https://github.com/Magneticon', '_blank');">Magneticon</DIV>
    </BODY>
</HTML>
